<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球科学学院 | 资源导航站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --stone-900: #1a1c1e;
            --stone-800: #2d3135;
            --earth-blue: #2c4159;
            --earth-gold: #b59f7b;
            --bg-paper: #f2f0eb;
            --text-main: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-paper);
            color: var(--text-main);
            line-height: 1.6;
        }

        body::before {
            content: "SCHOOL OF EARTH SCIENCES";
            position: fixed;
            left: 20px;
            bottom: 100px;
            writing-mode: vertical-rl;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: rgba(0,0,0,0.1);
            font-weight: 700;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 60px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 40px;
        }

        .landsat-wrapper {
            flex-shrink: 0;
        }

        .landsat-img {
            max-width: 280px;
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px; 
            filter: grayscale(0.1) contrast(1.05);
            box-shadow: 12px 12px 0px var(--earth-blue);
        }

        .header-text h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.8rem;
            color: var(--earth-blue);
            margin-bottom: 8px;
        }

        .header-text p {
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: var(--earth-gold);
            font-weight: 700;
        }

        .notice {
            background: var(--earth-blue);
            color: #fff;
            padding: 20px 30px;
            margin-bottom: 50px;
            position: relative;
            font-size: 0.95rem;
            clip-path: polygon(0 0, 100% 0, 99% 100%, 0% 100%);
        }

        .notice b { color: var(--earth-gold); }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex-grow: 1;
        }

        .nav-card {
            background: white;
            padding: 40px 20px;
            text-decoration: none;
            color: inherit;
            border: 1px solid #ddd;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .nav-card:hover {
            border-color: var(--earth-blue);
            background: var(--stone-900);
            color: white;
        }

        .nav-card::after {
            content: "ENTER →";
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s;
        }

        .nav-card:hover::after {
            opacity: 1;
            transform: translateX(0);
            color: var(--earth-gold);
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            margin-bottom: 30px;
            stroke-width: 1.5px; 
        }

        .nav-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.4rem;
        }

        .footer {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            text-align: right;
            font-size: 0.85rem;
            color: #666;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 25px; }
            .nav-grid { grid-template-columns: 1fr; }
            .header-text h1 { font-size: 2.2rem; }
            .landsat-img { max-width: 220px; box-shadow: 8px 8px 0px var(--earth-blue); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="landsat-wrapper">
                <img src="public/zjues.png" alt="ZJUES Landsat" class="landsat-img">
            </div>
            <div class="header-text">
                <h1>地球科学学院</h1>
                <p>资源导航站</p>
            </div>
        </header>

        <div class="notice">
            <strong>访问提示：</strong> 本站为资源导航站。核心资料需在 <b>ZJU 校园网</b> 或连接 <b>RVPN</b> 环境下访问。
        </div>

        <nav class="nav-grid">
            <a href="gis/" class="nav-card">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <div class="nav-title">地理信息科学</div>
            </a>
            
            <a href="geology/" class="nav-card">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <div class="nav-title">地质学</div>
            </a>

            <a href="atmosphere/" class="nav-card">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
                <div class="nav-title">大气科学</div>
            </a>
        </nav>

        <footer class="footer">
            Copyright &copy; 2026 cc98-地球科学学院
        </footer>
    </div>

</body>
</html>
